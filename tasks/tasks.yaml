  - id: TOOL-002
    title: "Write down the rules for adding a lint check"
    status: todo
    priority: medium
    owner: mike
    blockedBy: []
    context: |
      procedures/lint.md lists which check is error, warn or info. Nothing states the rule
      that produced that split, so anyone adding a check inherits a table to copy rather than
      a principle to apply. Four rules were articulated in a kd-nytka session on 2026-07-29
      and appear nowhere in this repo:

      1. An error is never a matter of taste. Error means the package contradicts itself or
         the calendar. Warn means a human should look. Info is FYI.
      2. Lint never requires configuration. A rule that needs configuring is a preference,
         and preferences belong in AGENTS.md where a human reads them. A config file is how a
         linter becomes negotiable.
      3. A new check enters as info or warn and is promoted to error only after it has been
         right in practice. A check that errors wrongly on day one teaches people to ignore
         the tool.
      4. Lint reads what the project declares and silently skips what does not apply.
         SPEC.md:138 already offers `tracker: file | github-projects | linear | jira`; a check
         assuming one of them is noise to a project on another, and a linter that warns about
         a platform you do not use is a linter people stop running.

      Rule 4 has a consumer waiting, and it is now in another repo: the tasks.yaml checks
      moved to kd-nytka as RT-007 under 0009, and cannot be written until rule 4 exists here.
      Cross-repo blocker, so RT-007 names this task rather than blockedBy-ing it.

      This task stayed here when the implementation work left. Lint's rules are read by anyone
      adding a check, including someone who installed nothing — referenced, not installed.

      Separately, AGENTS.md called lint "the conformance rules expressed as code". §13 names
      three conformance requirements; lint errors on six checks, of which `stale`,
      `decision-graph` and `dataset` are not conformance failures at all. The code draws the
      boundary correctly and that sentence did not.
    acceptanceCriteria:
      - "the four rules are recorded where 0003 is, or in AGENTS.md, and are reachable from procedures/lint.md"
      - "AGENTS.md no longer describes lint as the conformance rules expressed as code"
      - "node tools/nytka-lint.mjs . passes with zero errors"
    workLog:
      - at: 2026-07-29
        note: |
          Second criterion met — the sentence was removed when AGENTS.md was rewritten for
          0009. The four rules are what is left.
    created: 2026-07-29
    updated: 2026-07-30

  - id: SPEC-003
    title: "Settle what artifacts/ is, now that its decision trigger has fired"
    status: proposed
    proposedBy: agent:claude-opus-5
    priority: medium
    owner: mike
    blockedBy: []
    context: |
      Proposed by an agent on 2026-07-30 while reconciling this registry. Not committed work
      until a human accepts it — see decision 0006.

      unresolved.md names the trigger as "the second repo that needs the same asset, or the
      first time an agent has to answer 'is this file current?' about something with no
      frontmatter". Both halves have now happened. This repo carries vendored brand assets in
      artifacts/logo/ whose originals are canonical elsewhere, and answering "are these current?"
      required comparing checksums by hand because no registry had an entry for them.

      What the exercise found, and what a decision has to account for:

      1. The registry is what makes a binary legible, and an empty registry is worse than none
         — it reads as "nothing here" rather than "nobody filled this in". Creating one and
         never filling it is the default outcome, so §3 has to make filling it cheaper than
         skipping it.
      2. artifacts/ is holding two unlike things — durable inputs the project consumes (a
         logo) and outputs it produced. The working rule covers both and the §3 description
         ("outputs worth referencing") covers only one.
      3. Vendored copies need a direction-of-truth field. The canonical side must be able to
         name every repo holding a copy, or superseding an asset is guesswork; the derived side
         has nowhere to say "this is a copy, replace it from there, do not edit it here" except
         prose in a summary.
      4. Provenance across a visibility boundary is unsolved, and this repo is the case. It is
         public; the originals are not. `source` names something no reader here can open, so the
         claim is honest and permanently uncheckable by its own audience. The trust tiers cannot
         express that — `verified` says "someone checked", never "and you cannot".

      Written without reference to the private repo's contents, per AGENTS.md.
    acceptanceCriteria:
      - "SPEC §3 or a new section says what artifacts/ holds, or the question is closed in unresolved.md with a reason"
      - "the entry shape is stated somewhere normative, not only in a README"
      - "a vendored copy is distinguishable from a canonical original by field, not by prose"
      - "the format can express a provenance claim whose source the reader cannot access"
    created: 2026-07-30
    updated: 2026-07-30

