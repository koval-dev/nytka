schemaVersion: "0.1"

id: nytka
name: Nytka
type: side-project
status: active

purpose:
  description: >
    Project context for AI agents — a directory layout, a frontmatter vocabulary and three
    operations that keep a project's tasks, decisions, research, data and current state
    accurate while agents write most of it.
  primaryOutcome: >
    An agent given one link can pick up, or start, a project without a human re-explaining it.

owners:
  projectOwner: Mike

# Nytka manages itself under its own rules. This repo IS a nytka package — the dogfood,
# and the first source of bug reports.
components:
  spec:
    path: SPEC.md
    role: the normative, self-contained document that gets linked to an agent
  template:
    path: templates/project
    role: scaffold copied when starting a new project
  tools:
    path: tools
    role: nytka-lint — zero-dependency health check

capabilities:
  - context-format-design
  - agent-instruction-design
  - tooling

tasks:
  tracker: file
  storage: registry
  registry: tasks/tasks.yaml
  idPrefixes: [SPEC, TOOL, DOC, ADOPT]

