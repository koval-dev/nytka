  - id: TOOL-005
    title: "Read a wrapped YAML value instead of abandoning the file at it"
    status: done
    priority: high
    owner: mike
    blockedBy: []
    context: |
      `nytka status` reported one task against a file holding seven, and said so with exit 0.

      DOC-001 gained a wrapped quoted string in `evidence` on 2026-07-30. parseYaml consumed
      one line per scalar, so the continuation line matched nothing and every enclosing
      structure broke on it — six tasks and DOC-001's own `created` and `updated` were dropped.
      `next` said nothing was ready; `task show SPEC-002` said there was no such task; lint
      said clean, because lint does not read this file. Every count printed was wrong and
      believable, which is worse than a visible parse error.

      The file was never at fault. A wrapped double-quoted scalar is legal YAML and a
      spec-compliant parser folds it correctly, so putting the string back on one line would
      have left a tool that silently truncates the next one.

      The defect was not really about wrapped values, it was about failing quietly, and it was
      not confined to tasks: the same break in markdown frontmatter took `status` and
      `stale_after` with it, so staleness detection would have gone silent on the document
      that needed it.

      Reported by an external reviewer, who reproduced the count and named the cause correctly.
      The regression entered in f32f407 — the commit that fixed DOC-001's staleness — so the
      reconcile that closed one gap opened another, in a file nothing checks.
    acceptanceCriteria:
      - "a wrapped quoted, plain or bracketed value folds instead of ending the document"
      - "content the parser cannot read raises with a file and line, rather than returning what parsed so far"
      - "the whole task count is asserted after parsing, not just the shape of one task"
      - "fixtures cover evidence, workLog, block scalars and wrapped values"
      - "`task list --status todo` filters, in both the space and equals forms"
    evidence:
      - "tools/nytka-yaml.mjs: values fold continuation lines; unparsed content and trailing lines
         raise. The fix landed in tools/nytka.mjs and moved here later the same day under 0010,
         when lint and the task commands stopped carrying a parser each"
      - "every task in this file is returned — 7 of 7 when this closed, 9 of 9 re-checked after two
         tasks were added (2026-07-30). The same bug was dropping tasks from the tools repo's
         registry too; the count there is not this repo's to publish"
      - "ids, statuses and titles match a spec-compliant parser on both registries"
      - "all 39 frontmatter and yaml blocks across both repos parse — no false positives from the new errors"
      - "22 tests, including the whole-file count and the symlink main-guard. They live with the
         source in the tools repo and are not readable from here — tools/nytka.test.mjs was
         committed here on 2026-07-30 and removed the same day under 0010"
      - "the main-guard was wrong the same way the tools repo had already recorded for its own bins — through a symlink the CLI printed nothing, exit 0; now realpathSync"
    created: 2026-07-30
    updated: 2026-07-30

  - id: TOOL-007
    title: "The template's private/ survived this repo's ignore rule by grandfathering, not by design"
    status: done
    priority: high
    owner: mike
    blockedBy: []
    context: |
      `templates/project/private/README.md` is the file that tells a scaffolded project where
      secrets go, and the whole reason `templates/project/gitignore` carries a `private/` line.

      Line 1 of THIS repo's `.gitignore` was a bare `private/`, which matches that template
      directory. The file was tracked anyway — it was added before the rule existed. So the one
      document that explains the secrets rule was being kept only by the accident of having
      arrived first, and a single `git rm --cached` would have removed it with nothing to say
      so.

      That is not hypothetical. The same shape, in the repo that vendors this template and
      publishes it, cost `@nytka/cli` the file: `0.4.0` on npm scaffolds a project with no
      `private/` directory at all, under an `AGENTS.md` stating `private/` is gitignored. The
      difference between the two repos was which came first, the rule or the file — nothing
      more. Fixed in `0.4.1`; both are checkable on npm, which is where a reader here should
      look rather than at a repo they cannot open.

      The fix is one line after `private/`:

          !**/templates/project/private/

      It names the DIRECTORY, not the file inside it. Git never descends into an excluded
      directory, so a negation naming the README re-includes nothing — checked with
      `git check-ignore -v --no-index` in both directions rather than assumed. The `**/` prefix
      is what lets the identical line hold wherever the template sits, at a repo root or nested
      under a package.

      A real `private/` anywhere else in this repo is still ignored, which was verified rather
      than reasoned about.
    acceptanceCriteria:
      - "templates/project/private/ is re-included by an explicit rule, not by having predated the rule that excludes it"
      - "`git check-ignore -v --no-index templates/project/private/README.md` reports it NOT ignored"
      - "a private/ directory anywhere else in this repo is still ignored"
      - "node tools/nytka-lint.mjs . passes with zero errors"
    evidence:
      - "`git check-ignore -v --no-index private/anything.md` -> `.gitignore:2:private/`, while the
         same command against templates/project/private/README.md exits 1 with no match (2026-07-30)"
      - "npm: @nytka/cli 0.4.0 ships templates/project without private/; 0.4.1 ships it with"
    created: 2026-07-30
    updated: 2026-07-30

  - id: PROC-001
    title: "Write the procedure for when an agent may spend a human's attention"
    status: review
    priority: high
    owner: mike
    acceptedBy: human:mike
    blockedBy: []
    context: |
      Requested by the owner on 2026-07-31, in these words: the project felt like "a million
      questions and no algorithm how to find answer", questions arriving "from areas that maybe
      not so important", and answers arriving as "several pages of text with reference to ticket
      numbers — it is not for humans".

      Two failures, and only the second is the one people try to fix. The first is volume: an
      agent asks questions it could have answered from `SPEC.md` or decided itself under P6. The
      second is shape: when a question is worth asking, it arrives citing a task ID, with no
      costs attached to the options, and with the decision buried under the investigation.

      The structural cause is an asymmetry, not a wording habit. An agent accumulates context all
      session and the owner does not, so every question is asked from a position of much more
      context than the person answering has. That is what "losing control" is: being asked to
      arbitrate details whose origin you never saw. The remedy is that a question must rebuild
      its own context in one sentence, and must arrive BEFORE the work rather than after — a
      question raised once a day's work depends on it is an approval request wearing a question
      mark.

      This is a procedure and not a spec section. §7's bar is a workflow done twice that went
      wrong the same way both times, and the failure-conditions table is where the value sits;
      the bottom three rows of it are this repo's own, dated. A lint check was considered and
      rejected for now: lint checks form and never truth, so it could catch a malformed question
      but never an unnecessary one — which is the actual complaint. Rule 3 of
      decisions/0008 is the escape hatch if a checkable half emerges later.

      The anchor that makes it nytka's procedure rather than generic advice: the format already
      names exactly three points where a human is structurally required — `acceptedBy` leaving
      `proposed`, criteria checked leaving `review`, and a decision when an `unresolved.md`
      trigger fires. A question mapping to none of the three is almost always already answered
      or cheap enough to decide.
    acceptanceCriteria:
      - "a procedure exists stating when an agent may interrupt a human, in SPEC §7's shape"
      - "it carries a failure-conditions table drawn from what actually went wrong here, not from hypotheticals"
      - "it covers handing back finished work, not only asking questions"
      - "an agent starting cold in a scaffolded project reads the rule without being told to"
      - "it says what to do with a question that cannot be answered yet, rather than leaving that to block"
      - "node tools/nytka-lint.mjs . passes with zero errors"
    workLog:
      - at: 2026-07-31
        note: |
          Written as `procedures/ask-the-owner.md`. Three-test filter, the shape a passing
          question takes, the review handback, and a nine-row failure table.

          Criterion 4 is the one that needed a decision rather than prose. The procedure lives in
          this repo, which is referenced and not installed, so a scaffolded project would never
          see it by default. Resolved by putting the short form directly in
          `templates/project/AGENTS.md` — the file every new project gets and every agent reads
          without being pointed at it — with the full procedure linked for the case it does not
          cover. Both repos' own AGENTS.md got the same treatment.

          Criterion 5 is P6 rather than anything new: a question that cannot be answered yet is
          not asked and does not block. It goes to `unresolved.md` with a working rule so work
          continues and a trigger that names what will schedule the decision. Stating it in the
          filter matters because parking is the branch agents skip — they either ask or stall.

          `review` rather than `done`: this procedure's own step 3 forbids the author of the work
          from also declaring it met, and `completionSummary`/`evidence` are absent deliberately —
          §8 requires them to enter `done`, not `review`.
    created: 2026-07-31
    updated: 2026-07-31

  - id: SPEC-004
    title: "Apply 0009 to SPEC §4 — the snapshot line names an unreadable file and gitignores it"
    status: proposed
    proposedBy: claude-opus-5
    priority: high
    owner: mike
    blockedBy: []
    context: |
      Proposed by an agent on 2026-07-31 while designing the GitHub tracker. Not committed work
      until a human accepts it — see decision 0006.

      SPEC.md:141 reads:

          snapshot: tasks/snapshot.md   # generated, read-only, gitignored

      Two defects in one line, both predating the use case that exposed them.

      **`.md` is unreadable by this format's own tooling.** `nytka status`, `next`, `task` and
      `context` parse YAML through `loadTasks()`, and so does lint. Nothing in the line reads
      markdown as tasks. The example names a file the example's own tools cannot open.

      **`gitignored` defeats the reason §8 gives for the snapshot existing** — "so agents get
      cheap offline context". Gitignored, it does not survive a clone and does not reach a second
      machine, so the cheap offline context is available in exactly one working copy. The owner
      works across several environments and wants the backlog readable in every clone, which is
      what forced the question.

      [0009](../decisions/0009-tracker-snapshot-is-committed-yaml.md) records the change and the
      reasoning, including why 0004 is NOT marked superseded even though one of its consequences
      no longer holds. That asymmetry is its own entry in unresolved.md.

      **This task exists because the SPEC edit waits on the decision being confirmed.** SPEC-002
      established that sequence and it is why §8 was right when it landed: 0006 was settled by the
      owner first, then §8 was written. Editing §4 against a `draft` record would invert it.

      The design this serves is in the development repo, which is where a choice constraining more
      than one repo belongs. What is in scope here is two lines of §4 and nothing else.
    acceptanceCriteria:
      - "0009 is confirmed by the owner, or the SPEC edit is abandoned with a reason"
      - "§4's example names a file the task commands can actually parse"
      - "§4 no longer says the snapshot is gitignored, and says what makes it distinguishable from an authored registry"
      - "a project on tracker: file needs no new key and no migration"
      - "node tools/nytka-lint.mjs . passes with zero errors"
    created: 2026-07-31
    updated: 2026-07-31
