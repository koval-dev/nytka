  - id: TOOL-006
    title: "Promote unfilled-placeholder to error once it has earned it"
    status: blocked
    priority: low
    owner: mike
    blockedBy: [ADOPT-001]
    context: |
      C11 (`unfilled-placeholder`, `template-comment`) shipped 2026-07-30 in kd-nytka and
      currently reports at `warn`. It went out at `error` and was demoted the same day under
      TOOL-002 rule 3 — a new check enters as info or warn and is promoted only after it has
      been right in practice.

      It has evidence, but not the kind that counts yet: it fired correctly on
      `stonewizards/com` and `kd-agency`, with zero false positives against the templates' own
      format documentation, which is the failure mode that would have made it noise. Both
      packages came from the same template, so that is one observation rather than two.

      Blocked on TOOL-002 rather than on a date, because the promotion bar is exactly what
      TOOL-002 has to define. Promoting on a hunch is what rule 3 exists to stop, and doing it
      before the rule is written would repeat the mistake that created this task.
    acceptanceCriteria:
      - "the promotion bar TOOL-002 defines is stated, and this check is measured against it"
      - "the check has been right on a package that did not come from the template that prompted it"
      - "promoting it does not turn any existing package's warnings into errors unexamined"
      - "template-comment is scoped to prose, or it is promoted separately from unfilled-placeholder"
    workLog:
      - at: 2026-07-30
        note: |
          The two halves of C11 do not share the scoping the code comment above them claims for
          both. `unfilled-placeholder` strips fences and code spans before matching;
          `template-comment` tests the raw file. So an HTML comment marker inside a fence fires
          it, and any document that explains the check trips it — which happened while writing
          the check into procedures/lint.md, and is why that row now describes the marker in
          words instead of showing it.

          This bears directly on the third criterion. Promoted as it stands, `template-comment`
          turns every document that documents it into an error, starting with this repo's own
          lint procedure. Recorded here rather than acted on: lint's implementation lives in
          kd-nytka under 0009, so the fix is that repo's, and what belongs here is the rule it
          has to satisfy — hence the fourth criterion.
      - at: 2026-07-30
        note: |
          Fixed in kd-nytka the same day, as RT-012 there. Both halves of C11 now match against
          the same code-stripped prose, so a document that shows the marker inside a fence or a
          code span reports nothing, and the row in procedures/lint.md shows it again rather
          than describing it in words — the entry above is superseded on that point.

          The fourth criterion's first branch is closed: `template-comment` IS scoped to prose,
          so it no longer has to be promoted separately. A freshly scaffolded package still
          reports it, asserted there against the real templates rather than a fixture.

          This does not promote anything and does not unblock this task. Both levels are still
          `warn`, TOOL-002 still owns the bar, and being correctly scoped is not the same as
          having been right somewhere nobody predicted — which is what rule 3 asks for. What is
          removed is the reason the check could not have been promoted even once the bar exists.
      - at: 2026-07-31
        note: |
          **The bar exists — [0008](../decisions/0008-lint-check-rules.md) rule 3 — and this
          check does not clear it.** Two of four criteria met. Staying `blocked`.

          Rule 3 asks for four things at promotion, measured against the check as it stands:
          two correct findings from inputs that do not share an origin, one of them from
          somewhere nobody predicted, no outstanding false positive, and nothing going red
          unexamined. Against them:

            1. *the bar is stated, and this check is measured against it* — **met**. That is
               this entry, and it is the only criterion writing 0008 could close.
            2. *right on a package that did not come from the template that prompted it* —
               **not met**, and unchanged since this task was created. Still the same two
               packages, still one template, still one observation. Running clean on this repo
               and on a fresh scaffold is evidence about false positives and none about being
               right: a check that has never fired outside its origin has one observation,
               however many packages it has run clean on.
            3. *promotion turns no existing warning into an error unexamined* — **not met**.
               Both adoptions still carry unfilled safety-rule placeholders — nobody has said
               which external system needs confirmation before a write, or what the client owns
               (see ADOPT-001). Promoting today would turn two live packages red on findings
               that are correct and that nobody has answered. Rule 3's fourth clause says those
               get read first, not that they get promoted first.
            4. *`template-comment` scoped to prose or promoted separately* — **met**
               2026-07-30.

          **And a fifth thing, which is the one that actually stops it.** Rule 3's third clause
          counts false positives against the check *as it currently stands*, and there is a live
          class: markdown lets a code span wrap across a newline, and the stripper's span pattern
          excludes newlines, so a wrapped span survives stripping and its contents are read as
          prose. A command example wrapped mid-span reports a placeholder that is not one.
          Reproducible in three lines against `tools/nytka-lint.mjs`. Until that is fixed
          upstream, the check is not promotable however many independent catches arrive — and
          any catches collected before the fix are evidence about a different check.

          **A note on why this stays `blocked` and what that costs.** TOOL-002 is at `review`, so
          `blockedBy` is still unresolved and §8's rule holds. But the honest blocker is no longer
          a task: it is a catch on a package nobody has scaffolded yet. `blockedBy` names tasks,
          so when TOOL-002 closes this one has nothing to put there, and §8 will push it to
          `ready` while it is not startable. Recorded in 0008's consequences as a gap in the
          format rather than fixed here.
      - at: 2026-07-31
        note: |
          **TOOL-002 closed, the predicted moment arrived, and the prediction was half wrong.**
          `blockedBy` went stale, `task-blocked-consistency` said so unprompted, and the
          mechanically correct move was `ready` on a task nobody can start — exactly as the entry
          above warned.

          What the entry got wrong is that there was nothing to point at. Criterion 3 —
          *promotion turns no existing warning into an error unexamined* — waits on the two
          adoptions' unfilled safety-rule placeholders being answered, and that is **ADOPT-001**,
          open in this registry. So `blockedBy: [ADOPT-001]` is a real dependency, not a
          placeholder kept to satisfy a rule, and this stays `blocked` honestly.

          The stripper false positive is the other outstanding item and is genuinely not a task
          here: lint's source is in the development repo under 0009, and it is filed there. It
          gates promotion under rule 3's third clause, and this task's `blockedBy` cannot name it
          because `blockedBy` does not cross registries — the same cross-repo shape RT-007 hit,
          handled the same way, by naming it rather than linking it.

          The format gap 0008 recorded is therefore narrower than it looked: it is not "a task
          waiting on a condition has nothing to put in `blockedBy`", it is "a task waiting on
          work in another repo has nothing to put in `blockedBy`". That is a smaller and more
          tractable problem, and it is the second time this week it has come up.
    created: 2026-07-30
    updated: 2026-07-31

