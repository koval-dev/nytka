# Nytka's own backlog. Schema: SPEC.md §8.

tasks:
  - id: DOC-001
    title: "Publish nytka publicly so SPEC.md is linkable by URL"
    status: todo
    priority: high
    owner: mike
    blockedBy: []
    context: |
      The entire product proposition is "paste one link into any agent". That does not work
      until SPEC.md has a public raw URL. The repo exists but is private; README already
      documents the intended link as raw.githubusercontent.com/koval-dev/nytka/main/SPEC.md.
    acceptanceCriteria:
