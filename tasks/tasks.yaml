          Moved to in_progress. It had been sitting at `todo` while two adoptions already
          existed — `stonewizards/com` and `kd-agency` — which is this repo's recurring failure
          of a backlog nothing reconciles.

          `stonewizards/com` is the contrast this task wanted: reporting-heavy, with datasets/,
