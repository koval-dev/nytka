  - id: TOOL-002
    title: "Write down the rules for adding a lint check"
    status: done
    priority: high
    owner: mike
    blockedBy: []
    context: |
      procedures/lint.md lists which check is error, warn or info. Nothing states the rule
      that produced that split, so anyone adding a check inherits a table to copy rather than
      a principle to apply. Four rules were articulated in a kd-nytka session on 2026-07-29
      and appear nowhere in this repo:

      1. An error is never a matter of taste. Error means the package contradicts itself or
         the calendar. Warn means a human should look. Info is FYI.
      2. Lint never requires configuration. A rule that needs configuring is a preference,
         and preferences belong in AGENTS.md where a human reads them. A config file is how a
         linter becomes negotiable.
      3. A new check enters as info or warn and is promoted to error only after it has been
         right in practice. A check that errors wrongly on day one teaches people to ignore
         the tool.
      4. Lint reads what the project declares and silently skips what does not apply.
         SPEC.md:138 already offers `tracker: file | github-projects | linear | jira`; a check
         assuming one of them is noise to a project on another, and a linter that warns about
         a platform you do not use is a linter people stop running.

      Rule 4 has a consumer waiting, and it is now in another repo: the tasks.yaml checks
      moved to kd-nytka as RT-007 under 0009, and cannot be written until rule 4 exists here.
      Cross-repo blocker, so RT-007 names this task rather than blockedBy-ing it.

      This task stayed here when the implementation work left. Lint's rules are read by anyone
      adding a check, including someone who installed nothing — referenced, not installed.

      Separately, AGENTS.md called lint "the conformance rules expressed as code". §13 names
      three conformance requirements; lint errors on six checks, of which `stale`,
      `decision-graph` and `dataset` are not conformance failures at all. The code draws the
      boundary correctly and that sentence did not.
    acceptanceCriteria:
      - "the four rules are recorded where 0003 is, or in AGENTS.md, and are reachable from procedures/lint.md"
      - "AGENTS.md no longer describes lint as the conformance rules expressed as code"
      - "node tools/nytka-lint.mjs . passes with zero errors"
    workLog:
      - at: 2026-07-29
        note: |
          Second criterion met — the sentence was removed when AGENTS.md was rewritten for
          0009. The four rules are what is left.
      - at: 2026-07-30
        note: |
          Raised to high, because the cost stopped being hypothetical. A new check
          (`unfilled-placeholder`, C11) was added in kd-nytka and shipped at `error`, which
          rule 3 forbids — nobody adding it could read a rule that lives only in this task's
          context. Demoted to `warn` the same day once the rule was found. That is the exact
          failure this task predicts: the table is copyable, the principle is not, so the
          principle gets re-derived or skipped.

          Rule 3 also turns out to be underspecified in a way worth fixing while writing it
          down. It says a check is promoted "after it has been right in practice" and does not
          say what counts. C11 was right on two packages, but both were scaffolded from one
          template, so it is one observation wearing two hats. Whatever "right in practice"
          means, it has to exclude that.
      - at: 2026-07-31
        note: |
          **All three criteria met. Moved to `review`, not `done`** — see the last paragraph.

          The rules are decision [0008](../decisions/0008-lint-check-rules.md), `draft`. Home
          chosen against who reads them and when: the person adding a check is standing in
          procedures/lint.md looking at a table of levels, and the thing they need is the
          reasoning that produced it. That argues for a numbered record rather than the
          procedure itself, for two reasons. Lint's source and two procedures here already cite
          "rule 3" and "rule 4" BY NUMBER, so the rules need a stable numbered home that
          survives this task closing — and a decision is what this repo already uses for a
          choice that constrains future work (SPEC §6). procedures/lint.md gains an "Adding a
          check" section with the five rules in short form and the link.

          Per criterion:

            1. *recorded where 0003 is, or in AGENTS.md, and reachable from procedures/lint.md*
               — **met**. decisions/0008 is where 0003 is. Reachable from procedures/lint.md in
               three places, including a new section that exists to be found, plus
               procedures/init-project.md and the decisions index.
            2. *AGENTS.md no longer calls lint the conformance rules expressed as code* —
               **met**, re-checked by grep rather than taken from the 2026-07-29 entry: the
               phrase occurs nowhere in the repo.
            3. *lint passes with zero errors* — **met**. 0 errors, 0 warnings, 0 info,
               21 documents, 2026-07-31.

          **Five rules, not four.** The fifth has two named instances and is not derivable from
          the other four: a check must not fire on work that was correct when it was done. The
          required-field checks (`evidence` and `completionSummary` at `done`) are the case —
          correct by their own logic on every task they would flag, wrong under §8 on every one
          of them, because those fields bind at the transition and closed tasks are not
          backfilled. Rule 3 is about a check being right; rule 5 is about it being retroactive.

          A sixth was weighed and folded in rather than added. The ceiling — that the clause
          being enforced can cap a check below what rule 1 allows, as §8 does at `info` for the
          alias check and §13 does below `error` for any unknown-value check — is a clause of
          rule 1, because rule 1 is the rule that answers "what level?" and two rules answering
          one question is P2. A time-in-service bar was considered for rule 3 and rejected: the
          check that shipped wrong shipped wrong on evidence quality, not on youth.

          **"Right in practice" is now four clauses**: two correct findings from inputs that do
          not share an origin; one of them from somewhere nobody predicted; no outstanding false
          positive, counted against the check as it stands and including any document that
          reworded itself to get past it; and nothing going red unexamined. A clean run is
          evidence for the third clause and for nothing else.

          **Two findings that make something already written wrong, both recorded in 0008.**
          §8 cites §10 for a procedure §10 did not state — §10 said a check earns `error` by
          having been right in practice, about ONE check, and never that a check enters below
          `error`. That is the same shape as the miscitation 0006 exists to fix, this time
          inside the spec. §10 is amended to state the rule generally, which makes §8's existing
          citation true; no link out, because SPEC.md has none. Separately, rule 1 as articulated
          describes three of lint's five error checks: `required-file` and `missing-type` error
          because §13 requires those things, not because anything contradicts itself. The rule
          was applied for a week as though it covered all five. The code was right; the rule was
          incomplete.

          **Why `review` and not `done`.** Same reason as SPEC-002: 0006 added the state because
          whoever did the work does not also get to declare it met, and all three criteria were
          checked inside the session that did the work. `completionSummary` and `evidence` are
          deliberately absent — §8 requires them to enter `done`, not `review`.
    completionSummary: |
      The rules for adding a lint check are [0008](../decisions/0008-lint-check-rules.md),
      `stable` from 2026-07-31, reachable from `procedures/lint.md` including an "Adding a
      check" section that says to read them before picking a level.

      Five rules, not the four this task named. The fifth — **a check must not fire on work that
      was correct when it was done** — has two named instances and does not follow from the other
      four: the `done`-required-field checks would be correct by their own logic on every task
      they flagged and wrong under §8 on every one, because those fields bind at the transition.

      Rule 1 was corrected rather than transcribed. As stated here it said `error` means the
      package contradicts itself or the calendar, which described three of lint's five error
      checks; the other two error because §13 *requires* something, a different reason. The code
      had drawn the line correctly for a week while the rule its authors wrote down had not.

      Rule 3 gained the definition it was missing. "Right in practice" is two correct findings
      from inputs that do not share an origin, at least one from somewhere nobody predicted, no
      outstanding false positive against the check as it stands, and nothing going red unexamined.
      Independence is about origin, not count: two packages scaffolded from one template are one
      observation wearing two hats.

      Applying that bar disqualified the check waiting for promotion, on a ground nobody had
      spotted — Markdown permits a code span across a newline, the stripper's pattern excludes
      newlines, so a wrapped span survives stripping and its contents get reported as prose.

      Closed 2026-07-31 by the owner, who confirmed the rules at the same time. The strictness of
      rule 3 was put to them explicitly as the thing most likely to be wrong, and accepted as a
      standing rule rather than a one-off.
    evidence:
      - "decisions/0008-lint-check-rules.md: five rules, the four-clause definition of right in
         practice, and the ceiling clause on rule 1 — stable, verified human:mike 2026-07-31"
      - "procedures/lint.md links 0008 in four places, including the Adding a check section"
      - "`grep -n 'conformance rules expressed' AGENTS.md` exits 1 — the phrasing criterion 2
         names is gone (2026-07-31)"
      - "`grep -rn 'TOOL-002 rule' src/ tools/` in both repos returns nothing: the lint source
         cited this task for rules 3 and 4 and now cites the decision (2026-07-31)"
      - "node tools/nytka-lint.mjs . — 0 errors, 0 warnings, 0 info across 22 documents; the
         development repo 0/0/0 across 28 (2026-07-31)"
