    acceptanceCriteria:
      - "the promotion bar TOOL-002 defines is stated, and this check is measured against it"
      - "the check has been right on a package that did not come from the template that prompted it"
      - "promoting it does not turn any existing package's warnings into errors unexamined"
      - "template-comment is scoped to prose, or it is promoted separately from unfilled-placeholder"
    workLog:
      - at: 2026-07-30
        note: |
          The two halves of C11 do not share the scoping the code comment above them claims for
          both. `unfilled-placeholder` strips fences and code spans before matching;
          `template-comment` tests the raw file. So an HTML comment marker inside a fence fires
